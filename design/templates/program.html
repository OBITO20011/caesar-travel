<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../brand/tokens.css">
<style>
  /* Program poster: hotels + prices table over a real photo, beige + frosted glass */
  .canvas { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
  .photo {
    position: absolute; inset: 0;
    background-size: cover; background-position: var(--photo-pos, center top);
    transform: scale(1.02);
  }
  .veil {
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg,
        rgba(26,35,80,0.55) 0%,
        rgba(26,35,80,0.20) 26%,
        rgba(244,237,225,0.18) 40%,
        rgba(244,237,225,0.62) 62%,
        rgba(244,237,225,0.92) 100%);
  }
  .content { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 52px 56px 0; }

  /* header */
  .top { display: flex; justify-content: space-between; align-items: flex-start; }
  .logo { height: 150px; filter: drop-shadow(0 6px 18px rgba(0,0,0,0.25)); }
  .chip {
    display: inline-flex; align-items: center; gap: 12px;
    padding: 14px 26px; font-size: 28px; font-weight: 700; color: var(--white);
    border-radius: 999px;
  }
  .chip svg { width: 30px; height: 30px; }

  /* title */
  .title { margin-top: 26px; color: var(--white); text-shadow: 0 4px 24px rgba(10,15,45,0.45); }
  .kicker {
    display: inline-block; padding: 8px 22px; border-radius: 999px;
    background: rgba(244,237,225,0.9); color: var(--navy);
    font-size: 26px; font-weight: 800; text-shadow: none;
  }
  .title h1 { font-size: 104px; font-weight: 900; line-height: 1.12; margin-top: 10px; }
  .meta { display: flex; gap: 14px; margin-top: 8px; align-items: center; }
  .meta .pill {
    padding: 10px 24px; border-radius: 999px; font-size: 30px; font-weight: 800;
    background: var(--navy); color: var(--white); text-shadow: none;
  }
  .meta .note { font-size: 26px; font-weight: 500; opacity: 0.95; }

  /* table card */
  .card { margin-top: auto; padding: 18px 34px 22px; background: rgba(250,245,236,0.70); }
  table { width: 100%; border-collapse: collapse; }
  th {
    font-size: 25px; font-weight: 700; color: var(--ink-soft);
    padding: 12px 6px 14px; text-align: center;
  }
  th:first-child { text-align: right; }
  td { padding: 0 6px; text-align: center; border-top: 1.5px solid rgba(37,48,102,0.10); height: var(--row-h, 96px); }
  td.hotel { text-align: right; width: 44%; }
  th:first-child { width: 44%; }
  .hname { font-size: 33px; font-weight: 800; color: var(--navy); line-height: 1.15; }
  .hsub { font-size: 21px; font-weight: 500; color: var(--ink-soft); margin-top: 4px; display: flex; gap: 10px; align-items: center; }
  .tag { padding: 2px 12px; border-radius: 999px; background: var(--sand); color: var(--navy); font-weight: 700; font-size: 19px; }
  .price { font-size: 42px; font-weight: 900; color: var(--navy); }
  .price small { display: block; font-size: 17px; font-weight: 500; color: var(--ink-soft); margin-top: -4px; }
  tr.best .price { color: var(--navy-deep); }
  tr.best td.hotel .hname::after {
    content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 50%;
    background: var(--gold); margin-right: 12px; vertical-align: middle;
  }

  .includes {
    display: flex; justify-content: space-between; gap: 10px;
    margin-top: 14px; padding-top: 16px; border-top: 1.5px solid rgba(37,48,102,0.10);
  }
  .inc { display: flex; align-items: center; gap: 10px; font-size: 24px; font-weight: 700; color: var(--navy); }
  .inc svg { width: 30px; height: 30px; flex: none; }

  /* footer */
  .footer {
    margin: 22px -56px 0; padding: 22px 56px 26px;
    background: linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
    color: var(--white); display: flex; align-items: center; justify-content: space-between;
  }
  .wa { display: flex; align-items: center; gap: 16px; }
  .wa .ico { width: 64px; height: 64px; border-radius: 50%; background: rgba(255,255,255,0.12); display: grid; place-items: center; }
  .wa .ico svg { width: 36px; height: 36px; }
  .wa .lbl { font-size: 22px; font-weight: 500; color: var(--sand); }
  .wa .n { font-size: 50px; font-weight: 900; direction: ltr; line-height: 1; }
  .others { text-align: left; font-size: 24px; font-weight: 700; line-height: 1.5; color: var(--white); }
  .others .loc { color: var(--sand); font-weight: 500; font-size: 22px; }
  .fb { display: flex; align-items: center; gap: 10px; justify-content: flex-end; font-size: 25px; font-weight: 800; color: var(--white); }
  .fbico { width: 34px; height: 34px; flex: none; }
  .credit { position: absolute; left: 16px; top: 12px; font-size: 14px; color: rgba(255,255,255,0.85); direction: ltr; text-shadow: 0 1px 3px rgba(0,0,0,0.6); }

  /* story layout (1080x1920): keep top 220px and bottom 300px clear of key info */
  body[data-format="story"] .content { padding-top: 170px; }
  body[data-format="story"] .title h1 { font-size: 118px; }
  body[data-format="story"] .card { margin-top: 56px; padding: 24px 38px 28px; }
  body[data-format="story"] .footer { margin: 28px 0 0; border-radius: 32px; padding: 26px 36px; }
  body[data-format="story"] .spacer { flex: 1; }
</style>
</head>
<body>
<div class="canvas">
  <div class="photo" id="photo"></div>
  <div class="veil"></div>
  <div class="content">
    <div class="top">
      <img class="logo" id="logo" alt="">
      <div class="chip glass-dark" id="airline"></div>
    </div>
    <div class="title">
      <span class="kicker" id="kicker"></span>
      <h1 id="title"></h1>
      <div class="meta"><span class="pill num" id="duration"></span><span class="note" id="note"></span></div>
    </div>
    <div class="card glass">
      <table><thead><tr id="thead"></tr></thead><tbody id="rows"></tbody></table>
      <div class="includes" id="includes"></div>
    </div>
    <div class="footer">
      <div class="wa">
        <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 11.6a8.5 8.5 0 0 1-12.6 7.4L3.5 20.5l1.5-4.3A8.5 8.5 0 1 1 20.5 11.6z"/><path d="M9 8.6c.3 1.6 1.2 3.2 2.6 4.5 1.3 1.3 2.8 2.1 4.3 2.4l1.1-1.4-2-1-1 .9c-1-.5-1.9-1.4-2.4-2.4l.9-1-1-2-1.5 1z"/></svg></div>
        <div><div class="lbl">للحجز عالواتساب</div><div class="n num" id="wa"></div></div>
      </div>
      <div class="others"><div class="fb"><svg class="fbico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11.4" fill="#fff"/><path fill="#0866FF" d="M9.101 23.691v-7.98H6.627v-3.667h2.474v-1.58c0-4.085 1.848-5.978 5.858-5.978.401 0 .955.042 1.468.103a8.68 8.68 0 0 1 1.141.195v3.325a8.623 8.623 0 0 0-.653-.036 26.805 26.805 0 0 0-.733-.009c-.707 0-1.259.096-1.675.309a1.686 1.686 0 0 0-.679.622c-.258.42-.374.995-.374 1.752v1.297h3.919l-.386 2.103-.287 1.564h-3.246v8.245C19.396 23.238 24 18.179 24 12.044c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.628 3.874 10.35 9.101 11.647Z"/></svg><span id="fbname"></span></div><div class="num" id="others"></div><div class="loc" id="loc"></div></div>
    </div>
    <div class="spacer"></div>
  </div>
  <div class="credit" id="credit"></div>
</div>
<script>
const ICONS = {
  plane: '<path d="M10.5 13.5 3 11l1.2-1.2 9 .6 4.3-4.3a1.8 1.8 0 0 1 2.5 2.5l-4.3 4.3.6 9-1.2 1.2-2.5-7.5-3.3 3.3.3 2.4-.9.9-1.6-3.1-3.1-1.6.9-.9 2.4.3z"/>',
  hotel: '<path d="M4 21V5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v16M15 10h4a1 1 0 0 1 1 1v10M2 21h20M8 8h3M8 12h3M8 16h3"/>',
  visa: '<path d="M6 3h9l4 4v14H6z"/><path d="M9 14l2 2 4-4"/>',
  car: '<path d="M5 17h14M6 17v2M18 17v2M4 13l2-5a2 2 0 0 1 1.9-1.3h8.2A2 2 0 0 1 18 8l2 5v4H4z"/><circle cx="8" cy="14" r=".6"/><circle cx="16" cy="14" r=".6"/>',
  meal: '<path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 1-3 3-3 6v3h3v9"/>'
};
const svg = (k, color) => `<svg viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>`;
const P = window.POST;
document.body.dataset.format = P.format;
const $ = id => document.getElementById(id);

$('photo').style.backgroundImage = `url("${P.photo}")`;
if (P.photo_position) $('photo').style.setProperty('--photo-pos', P.photo_position);
$('logo').src = P.logo_white;
$('airline').innerHTML = svg('plane', '#fff') + P.airline;
$('kicker').textContent = P.kicker;
$('title').textContent = P.title;
$('duration').textContent = P.duration;
$('note').textContent = P.price_note || '';
$('credit').textContent = P.photo_credit || '';

const cols = P.columns;
$('thead').innerHTML = '<th>الفندق</th>' + cols.map(c => `<th>${c}</th>`).join('');
const min = Math.min(...P.hotels.map(h => h.prices[0]));
$('rows').innerHTML = P.hotels.map(h => `
  <tr class="${h.prices[0] === min ? 'best' : ''}">
    <td class="hotel"><div class="hname">${h.name}</div>
      <div class="hsub">${h.area ? `<span>${h.area}</span>` : ''}${h.meals ? `<span class="tag">${h.meals}</span>` : ''}</div></td>
    ${h.prices.map(p => `<td><div class="price num">${p}<small>دينار</small></div></td>`).join('')}
  </tr>`).join('');
const rowH = P.format === 'story' ? Math.min(124, Math.floor(700 / P.hotels.length)) : Math.min(100, Math.floor(500 / P.hotels.length));
document.documentElement.style.setProperty('--row-h', rowH + 'px');

$('includes').innerHTML = P.includes.map(i => `<div class="inc">${svg(i.icon, '#253066')}${i.text}</div>`).join('');
$('wa').textContent = P.whatsapp;
$('others').textContent = (P.phones || []).join('  ·  ');
$('loc').textContent = P.location;
$('fbname').textContent = P.facebook_name || '';

Promise.all([
  document.fonts.ready,
  ...[P.photo, P.logo_white].map(src => new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = src; }))
]).then(() => setTimeout(() => { window.__ready = true; }, 150));
</script>
</body>
</html>
